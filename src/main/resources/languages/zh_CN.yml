# 时间单位
time:
  seconds: "秒"
  minutes: "分钟"
  hours: "小时"
  days: "天"

# 错误消息
error:
  economy_disabled: "&c经济系统未启用！"
  database_error: "&c数据库错误，请联系管理员"
  no_permission_speed: "&c你没有权限调整飞行速度！"
  invalid_speed: "&c无效的速度值！请使用1-10之间的数字"
  world_disabled_fly: "&c此世界禁止使用飞行！"

# 商店消息
shop:
  player_limit_reached: "&c你今日已达到 {item} &c的购买上限 ({limit}张)！"
  server_limit_reached: "&c{item} &c今日全服购买量已达上限 ({limit}张)！"
  
# 命令消息
command:
  flyshop:
    usage: "&c用法: /flyshop"
    description: "打开飞行商店"
  fly:
    usage: "&c用法: /fly [player]"
    description: "切换飞行模式"
    speed:
      set: "&a飞行速度已设置为 &e{speed}"
      usage: "&c用法: /flyspeed <1-10>"
  flyadmin:
    usage: "&c用法: /flyadmin <give|remove|reload|stats> [player] [args]"
    reload_success: "&a配置文件已重新加载！"
    give_success: "&a已给予 &e{player} &a{type}飞行权限"
    remove_success: "&a已移除 &e{player} &a的飞行权限"
    stats_header: "&6===== &e{player}的飞行统计 &6====="
    stats_permanent: "&7永久飞行: {status}"
    stats_temp_time: "&7临时飞行时间: &e{time}"
    stats_total_fly_time: "&7总飞行时间: &e{time}"
    stats_total_distance: "&7总飞行距离: &e{distance} 方块"
    stats_purchases: "&7购买次数: &e{count}"
    stats_achievements: "&7成就进度: &e{unlocked}&7/&a{total}"
